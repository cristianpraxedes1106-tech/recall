<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck — RECALL</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head><body><nav class="navbar"><div class="container"><a class="brand" href="../index.html"><span class="brand-mark">R</span>RECALL</a><a class="nav-btn" href="decks.html">Voltar</a></div></nav><main class="container page-wrap"><section class="deck-hero"><span class="eyebrow">DECK</span><h1 id="title">Carregando...</h1><p id="desc" class="deck-info"></p><div class="d-flex gap-2 flex-wrap mt-3"><a id="start" class="primary-btn" href="#"><i class="bi bi-play-fill"></i>Começar a estudar</a><a id="quiz" class="secondary-btn" href="#">Fazer teste</a></div></section><section class="mt-4"><span class="eyebrow">ESCOLHA UM MODO</span><div class="mode-grid mt-2"><a id="modeFlash" class="mode-card" href="#"><i class="bi bi-copy"></i><strong>Flashcards</strong><span>Revise no seu ritmo.</span></a><a id="modeLearn" class="mode-card" href="#"><i class="bi bi-lightbulb"></i><strong>Aprender</strong><span>Pratique com perguntas.</span></a><a id="modeTest" class="mode-card" href="#"><i class="bi bi-ui-checks"></i><strong>Teste</strong><span>Veja quanto você sabe.</span></a><a id="modeMatch" class="mode-card" href="#"><i class="bi bi-grid-3x3-gap"></i><strong>Associar</strong><span>Combine termos e respostas.</span></a></div></section><section class="mt-5"><div class="section-head"><div><span class="eyebrow">CONTEÚDO</span><h2>Cards</h2></div><span id="count" class="muted"></span></div><div id="preview" class="deck-preview mt-3"></div></section></main><script src="../js/storage.js"></script><script src="../js/utils.js"></script><script>const d=getDeck(qs('id'))||getDecks()[0];document.title=`${d.title} — RECALL`;$('#title').textContent=d.title;$('#desc').textContent=d.description||`${d.cards.length} cards para estudar`;$('#count').textContent=`${d.cards.length} cards`;const id=encodeURIComponent(d.id);['start','modeFlash'].forEach(x=>$('#'+x).href=`study.html?id=${id}`);$('#quiz').href=`quiz.html?id=${id}`;$('#modeTest').href=`quiz.html?id=${id}`;$('#modeLearn').href=`quiz.html?id=${id}&mode=learn`;$('#modeMatch').href=`quiz.html?id=${id}&mode=match`;$('#preview').innerHTML=d.cards.map((c,i)=>`<div class="preview-card"><strong>${i+1}. ${esc(c.question)}</strong><span>${esc(c.answer)}</span></div>`).join('');</script></body></html>
