<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus decks — RECALL</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="../index.html"><span class="brand-mark">R</span>RECALL</a><nav class="nav-stack"><a class="nav-item" href="../index.html"><i class="bi bi-house-fill"></i>Início</a><a class="nav-item" href="games.html"><i class="bi bi-controller"></i>Jogos</a><a class="nav-item active" href="decks.html"><i class="bi bi-collection-fill"></i>Meus decks</a><a class="nav-item" href="create.html"><i class="bi bi-plus-circle-fill"></i>Criar deck</a><a class="nav-item" href="settings.html"><i class="bi bi-gear-fill"></i>Configurações</a></nav></aside><main class="main-content"><header class="topbar"><div class="search-box"><i class="bi bi-search"></i><input id="search" placeholder="Pesquisar nos seus decks..."></div><div class="top-actions"><button class="icon-btn" id="themeBtn"><i class="bi bi-sun-fill"></i></button><div class="wallet"><i class="bi bi-coin"></i><b id="coins">250</b></div><a class="avatar" href="settings.html">R</a></div></header><div class="page-container"><div class="d-flex justify-content-between align-items-end page-title"><div><span class="eyebrow">BIBLIOTECA</span><h1>Meus decks</h1><p>Seu conhecimento, pronto para virar jogo.</p></div><a href="create.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Novo deck</a></div><div id="deckGrid" class="deck-grid"></div></div></main></div><script src="../js/storage.js"></script><script src="../js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{applyTheme();const grid=document.querySelector('#deckGrid'),search=document.querySelector('#search');function render(){const q=(search.value||new URLSearchParams(location.search).get('q')||'').toLowerCase();const ds=RecallStore.get().decks.filter(d=>(d.title+' '+d.description).toLowerCase().includes(q));grid.innerHTML=ds.length?ds.map(d=>`<article class="deck-card"><div class="d-flex justify-content-between"><span class="stat-icon purple"><i class="bi bi-collection-fill"></i></span><button class="icon-btn btn-sm" onclick="removeDeck('${d.id}')"><i class="bi bi-trash3"></i></button></div><h3 class="mt-3">${esc(d.title)}</h3><p>${esc(d.description||'Sem descrição')}</p><div class="deck-foot"><span>${d.cards.length} cards</span><a class="play-mini" href="games.html?deck=${encodeURIComponent(d.id)}">Jogar</a></div></article>`).join(''):`<div class="empty"><i class="bi bi-collection fs-2 d-block mb-2"></i>Nenhum deck encontrado.<br><a class="see-all" href="create.html">Criar um deck</a></div>`}window.removeDeck=id=>{if(confirm('Excluir este deck?')){RecallStore.deleteDeck(id);render()}};search.value=new URLSearchParams(location.search).get('q')||'';search.oninput=render;render();document.querySelector('#themeBtn').onclick=()=>{const s=RecallStore.get();RecallStore.patch({theme:s.theme==='dark'?'light':'dark'});applyTheme()}});</script></body></html>
