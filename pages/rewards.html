<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recompensas — RECALL</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="../index.html"><span class="brand-mark">R</span>RECALL</a><nav class="nav-stack"><a class="nav-item" href="../index.html"><i class="bi bi-house-fill"></i>Início</a><a class="nav-item" href="games.html"><i class="bi bi-controller"></i>Jogos</a><a class="nav-item" href="decks.html"><i class="bi bi-collection-fill"></i>Meus decks</a><a class="nav-item active" href="rewards.html"><i class="bi bi-gift-fill"></i>Recompensas</a><a class="nav-item" href="create.html"><i class="bi bi-plus-circle-fill"></i>Criar deck</a><a class="nav-item" href="settings.html"><i class="bi bi-gear-fill"></i>Configurações</a></nav></aside><main class="main-content"><header class="topbar"><div class="search-box"><i class="bi bi-gift"></i><input disabled value="Recompensas"></div><div class="top-actions"><div class="wallet"><i class="bi bi-coin"></i><b id="coins">250</b></div><a class="avatar" href="settings.html">R</a></div></header><div class="page-container"><div class="page-title"><span class="eyebrow">LOJA DO RECALL</span><h1>Você jogou. Você ganhou.</h1><p>Use suas moedas para desbloquear coisas que realmente mudam sua experiência.</p></div><div class="game-grid" id="shop"></div><div class="section-head mt-5"><div><h2>Conquistas</h2><p>Metas que valem mais do que um número na tela.</p></div></div><div class="deck-grid" id="achievements"></div></div></main></div><script src="../js/storage.js"></script><script>const items=[['double','⚡','2x XP por uma partida','Jogue uma partida com XP dobrado por 24h.',120],['shield','🛡️','Escudo de erro','Ignore o próximo erro durante um jogo.',180],['theme','🌈','Tema Neon','Desbloqueie o visual Arcade Neon.',300],['streak','🔥','Congelador de streak','Proteja sua sequência por 1 dia.',220],['mystery','🎁','Caixa surpresa','Uma recompensa aleatória de moedas ou XP.',150],['avatar','👑','Coroa do Mestre','Mostre uma coroa ao lado do seu perfil.',500]];function render(){const s=RecallStore.get();document.querySelector('#coins').textContent=s.coins;document.querySelector('#shop').innerHTML=items.map(i=>`<article class="deck-card"><div style="font-size:42px">${i[1]}</div><h3>${i[2]}</h3><p>${i[3]}</p><div class="deck-foot"><span><i class="bi bi-coin"></i> ${i[4]}</span><button class="play-mini" onclick="buy('${i[0]}',${i[4]})">Resgatar</button></div></article>`).join('');document.querySelector('#achievements').innerHTML=[['Primeira partida','Jogue seu primeiro jogo.','🎮',s.answered>=1],['Mente afiada','Acerte 10 perguntas.','🧠',s.correct>=10],['Colecionador','Crie 3 decks.','📚',s.decks.length>=3],['Lenda do combo','Acumule 500 XP.','🏆',s.xp>=500],['Persistente','Chegue a 7 dias de sequência.','🔥',s.streak>=7],['Milionário de ideias','Tenha 1000 moedas.','🪙',s.coins>=1000]].map(a=>`<article class="deck-card"><div style="font-size:35px">${a[2]}</div><h3>${a[0]}</h3><p>${a[1]}</p><span style="color:${a[3]?'var(--success)':'var(--muted)'};font-weight:800">${a[3]?'✓ Desbloqueada':'○ Bloqueada'}</span></article>`).join('')}function buy(id,cost){const s=RecallStore.get();if(s.coins<cost)return alert('Você ainda precisa de mais moedas.');RecallStore.addCoins(-cost);if(id==='theme')RecallStore.patch({theme:'neon'});if(id==='mystery')RecallStore.addCoins(100);alert('🎁 Recompensa resgatada!');render()}render();</script></body></html>
