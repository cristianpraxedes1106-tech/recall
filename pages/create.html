<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar deck — RECALL</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head><body><nav class="navbar"><div class="container"><a class="brand" href="../index.html"><span class="brand-mark">R</span>RECALL</a><a class="nav-btn" href="decks.html">Cancelar</a></div></nav><main class="container page-wrap"><div class="row justify-content-center"><div class="col-lg-9"><div class="mb-4"><span class="eyebrow">NOVO DECK</span><h2 class="mt-2 fw-bold">Crie um conjunto de estudo</h2><p class="muted">Adicione seus termos e definições. Uma linha corresponde a um card.</p></div><div class="panel"><div class="row g-3"><div class="col-md-8"><label>Título</label><input id="title" class="form-control" placeholder="Ex.: História — Revolução Francesa"></div><div class="col-md-4"><label>Separador</label><select id="sep" class="form-select"><option value="|">|</option><option value=";">;</option><option value=":">:</option><option value="→">→</option><option value="\t">Tab</option></select></div><div class="col-12"><label>Descrição <span class="muted fw-normal">(opcional)</span></label><input id="desc" class="form-control" placeholder="Sobre o que é este deck?"></div><div class="col-12"><label>Termos e definições</label><textarea id="data" class="form-control" rows="15" placeholder="Pergunta | Resposta
Outra pergunta | Outra resposta"></textarea><div class="d-flex justify-content-between mt-2"><small class="muted">Formato: Pergunta | Resposta</small><small id="lineCount" class="muted">0 linhas</small></div></div></div><div class="d-flex gap-2 mt-4"><button id="save" class="primary-btn">Criar deck</button><a href="decks.html" class="secondary-btn">Cancelar</a></div></div></div></div></main><script src="../js/storage.js"></script><script src="../js/utils.js"></script><script src="../js/importer.js"></script><script>document.querySelector('#data').addEventListener('input',e=>document.querySelector('#lineCount').textContent=`${e.target.value.split(/\r?\n/).filter(Boolean).length} linhas`);</script></body></html>
