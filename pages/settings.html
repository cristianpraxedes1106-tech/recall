<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações - RECALL</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"></head><body><nav class="navbar py-3"><div class="container"><a class="brand" href="../index.html"><span class="brand-mark">R</span> RECALL</a></div></nav><main class="container page-wrap"><div class="row justify-content-center"><div class="col-lg-8"><div class="panel"><span class="eyebrow">PREFERÊNCIAS</span><h2>Configurações</h2><hr><div class="d-flex justify-content-between align-items-center py-3"><div><b>Efeitos sonoros</b><div class="muted">Sons de interação e resposta.</div></div><input id="sound" type="checkbox" checked></div><div class="d-flex justify-content-between align-items-center py-3"><div><b>Partículas</b><div class="muted">Animação ambiente da interface.</div></div><input id="particlesToggle" type="checkbox" checked></div><button id="reset" class="secondary-btn mt-3">Restaurar dados de demonstração</button></div></div></div></main><script>const s=document.querySelector('#sound');s.checked=localStorage.getItem('recall_sound')!=='0';s.onchange=()=>localStorage.setItem('recall_sound',s.checked?'1':'0');document.querySelector('#particlesToggle').onchange=e=>document.body.style.setProperty('--particle-state',e.target.checked?'1':'0');document.querySelector('#reset').onclick=()=>{if(confirm('Apagar seus dados locais e reiniciar os decks?')){localStorage.removeItem('recall_v1');location.href='../index.html'}};</script></body></html>
